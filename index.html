/* Тема дашборду УКУ. Червона домінанта за зразком «UCU Strategy 2030» (затверджено користувачем після хвилі 1); імена змінних історичні: --uku-navy = основний червоний. Вбудовувати в <style> дашборду цілком.
   Палітра з брендбуку УКУ; похідні відтінки для шкал підібрані так, щоб
   рівні шкали відрізнялися ще й світлотою (для дальтоніків і ч/б друку). */
:root {
  /* фірмові */
  --uku-navy: #7F1716;      /* основний: заголовки, шапка, вкладки */
  --uku-blue: #A8302F;      /* другорядний: «згода / прийнятно», студенти */
  --uku-wine: #5A0F0E;      /* акцент: «незгода / неприйнятно», викладачі */
  --uku-gold: #9C7D4A;      /* акцент: ключові цифри KPI, персонал, виділення */
  --uku-bg: #F5F3F0;        /* фон сторінки */
  --uku-bg-2: #E5E7EB;      /* фон карток, смуг, «не знаю» */
  --uku-text: #1A1414;      /* основний текст */
  --uku-muted: #5F6672;     /* підписи, n, примітки */
  --uku-card: #FFFFFF;

  /* розходжувальна шкала з 5 рівнів: від негативного до позитивного */
  --scale-1: #4A4541;
  --scale-2: #A29D97;
  --scale-3: #DCD6CC;       /* «важко сказати» — сіра середина */
  --scale-4: #C56B69;
  --scale-5: #7F1716;
  --scale-dk: #EEE9E1;      /* «не можу відповісти» поза шкалою: окремий стовпчик праворуч */

  /* групи респондентів (завжди однакові в усьому дашборді) */
  --group-students: #7F1716;
  --group-teachers: #9C7D4A;
  --group-staff: #C4A978;
  --group-uku: #5A0F0E;     /* «УКУ загалом» / середнє для порівняння */

  --radius: 10px;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--uku-bg); color: var(--uku-text); font-family: var(--font); line-height: 1.5; }
h1, h2, h3 { color: var(--uku-navy); line-height: 1.25; }
.kpi .value { color: var(--uku-navy); font-weight: 700; font-size: 2.2rem; }
.kpi .accent { border-top: 4px solid var(--uku-gold); }
.card { background: var(--uku-card); border-radius: var(--radius); padding: 1rem 1.25rem; box-shadow: 0 1px 2px rgba(23,43,77,.08); }
.muted, .n-label { color: var(--uku-muted); font-size: .85rem; }
.badge-small { background: var(--uku-bg-2); color: var(--uku-muted); border-radius: 999px; padding: 0 .5rem; font-size: .75rem; }
.draft { outline: 2px dashed var(--uku-gold); position: relative; }
.draft::before { content: "ЧЕРНЕТКА — потребує затвердження"; position: absolute; top: -.75rem; left: .75rem;
  background: var(--uku-gold); color: #fff; font-size: .7rem; font-weight: 700; padding: 0 .5rem; border-radius: 4px; }
.tabs button[aria-selected="true"] { border-bottom: 3px solid var(--uku-gold); color: var(--uku-navy); font-weight: 700; }
.chart-wrap { position: relative; width: 100%; overflow-x: auto; }
.disabled-filter { opacity: .5; cursor: not-allowed; }

@media (max-width: 720px) {
  .kpi .value { font-size: 1.7rem; }
}

/* друк / PDF: усі вкладки підряд, без фільтрів, без тіней, розриви перед розділами */
@media print {
  @page { size: A4; margin: 14mm; }
  html, body { background: #fff; }
  .tabs, .filters, .no-print { display: none !important; }
  .tab-panel { display: block !important; }
  .tab-panel + .tab-panel { break-before: page; }
  figure, .card { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  .card { box-shadow: none; border: 1px solid var(--uku-bg-2); }
  .draft::before { content: "ЧЕРНЕТКА"; }
  canvas { max-width: 100% !important; height: auto !important; }
}

/* червона домінанта за зразком «UCU Strategy 2030» */
:root {
  --uku-navy: #7F1716; --uku-blue: #A8302F; --uku-wine: #5A0F0E; --uku-gold: #9C7D4A;
  --uku-bg: #F5F3F0; --uku-text: #1A1414;
  --scale-1: #4A4541; --scale-2: #A29D97; --scale-3: #DCD6CC; --scale-4: #C56B69; --scale-5: #7F1716; --scale-dk: #EEE9E1;
  --group-students: #7F1716; --group-teachers: #9C7D4A; --group-staff: #C4A978;
}
:root {
  --serif: 'Literata', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  --border: #E8E2D8; --border-strong: #D4CCC0; --grid-line: #EFE9DF; --bg-soft: #FAF8F5;
  --text-soft: #4A4541; --muted-2: #8A847D; --accent-soft: #E8D9B8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--uku-text); background: var(--uku-bg);
  font-feature-settings: 'tnum' 1, 'cv11' 1; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--uku-gold); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

/* шапка */
.top { background: linear-gradient(135deg, #5A0F0E 0%, #7F1716 55%, #911E1C 100%); color: #fff; padding: 26px 0 30px;
  position: relative; overflow: hidden; border-bottom: 3px solid var(--uku-gold); }
.top::before { content: ''; position: absolute; top: -140px; right: -120px; width: 620px; height: 620px;
  background: radial-gradient(circle, rgba(196,169,120,.18) 0%, transparent 70%); pointer-events: none; }
.top-grid { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; position: relative; }
.brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 12px; letter-spacing: .16em;
  text-transform: uppercase; color: #C4A978; font-weight: 600; }
.brand-logo { width: 46px; height: 46px; border-radius: 50%; background: #fff; overflow: hidden; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; border: 1px solid rgba(232,217,184,.45); }
.brand-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.top h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 8px; color: #fff; max-width: 34ch; }
.motto { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 14.5px; color: #C4A978; max-width: 70ch; }
.meta-block { text-align: right; color: rgba(255,255,255,.85); }
.period { font-family: var(--serif); font-size: 26px; font-weight: 600; color: #C4A978; line-height: 1; }
.meta-label { font-size: 11px; text-transform: uppercase; letter-spacing: .15em; color: rgba(255,255,255,.6); margin-top: 6px; }
.meta-ns { margin-top: 12px; font-size: 12.5px; color: rgba(255,255,255,.8); }
.meta-ns b { font-family: var(--serif); font-size: 16px; color: #fff; font-weight: 600; margin: 0 3px 0 10px; }

/* рядок вкладок + фільтри справа */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(250,248,245,.97); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 0; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { white-space: nowrap; border: 0; background: transparent; font: 500 13px var(--sans); color: var(--text-soft); padding: 7px 13px; border-radius: 7px; cursor: pointer; }
.tabs button:hover { background: var(--accent-soft); color: var(--uku-navy); }
.tabs button[aria-selected="true"] { background: var(--uku-navy); color: #fff; }
.filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filters label { font-size: 12px; color: var(--muted-2); }
.filters select { font: 13px var(--sans); padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: #fff; color: var(--uku-text); max-width: 260px; }
.filters select.on { border-color: var(--uku-navy); box-shadow: 0 0 0 2px rgba(127,23,22,.18); }
.filters .reset { border: 0; background: transparent; color: var(--uku-blue); font: 500 12.5px var(--sans); cursor: pointer; padding: 4px 6px; }
main { padding: 22px 0 50px; }
.tab-panel { display: none; } .tab-panel.active { display: block; }

/* розділи */
section.block { margin: 0 0 30px; scroll-margin-top: 62px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 6px 0 8px;
  border-bottom: 2px solid var(--uku-navy); margin-bottom: 14px; flex-wrap: wrap; }
.section-title { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--uku-navy); margin: 0; }
.section-meta { font-size: 12px; color: var(--muted-2); }

/* щільна сітка карток */
.grid { display: grid; gap: 16px; margin-bottom: 16px; }
.grid > * { min-width: 0; }
.g1 { grid-template-columns: minmax(0, 1fr); } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr) !important; } }
/* частка цілого: один 100%-стовпчик */
.stack { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; }
.stack > span { display: block; flex: none; text-align: center; font: 600 11px/28px var(--sans); color: #fff; white-space: nowrap; overflow: hidden; }
.stack-legend { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; color: var(--text-soft); }
.pie-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
.pie-box { position: relative; height: 150px; }
.pie-legend { align-self: center; }
.g1 .stack-legend { display: flex; flex-wrap: wrap; gap: 4px 28px; } .g1 .stack-legend b { margin-left: -20px; }
.stack-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
figure.fig, .card { margin: 0; background: var(--uku-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px 16px; min-width: 0; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-title { font-size: 14.5px; font-weight: 600; color: var(--uku-text); line-height: 1.35; margin: 0; }
.card-sub { font-size: 12px; color: var(--muted-2); margin-top: 3px; line-height: 1.4; }
.card-tag { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 20px; white-space: nowrap; background: #F4E4E3; color: var(--uku-navy); }
sup.sig { color: var(--uku-navy); font-weight: 700; font-size: .95em; margin-left: 2px; cursor: help; }
.starnote { font-size: 11.5px; color: var(--muted-2); margin-top: 6px; line-height: 1.4; }
.starnote b { color: var(--uku-navy); }
.empty { padding: 18px 10px; text-align: center; color: var(--muted-2); font-style: italic; background: var(--bg-soft); border-radius: 8px; font-size: 12.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--text-soft); margin: 0 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart-wrap { position: relative; width: 100%; }

/* головне */
.kpi-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.kpi { background: var(--uku-card); border: 1px solid var(--border); border-left: 3px solid var(--uku-navy); border-radius: 10px; padding: 14px 16px; }
.kpi-label { font-size: 12px; color: var(--muted-2); margin-bottom: 4px; }
.kpi-value { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--uku-navy); line-height: 1.05; }
.kpi-text { font-size: 13px; font-weight: 600; color: var(--uku-text); margin-top: 4px; line-height: 1.35; }
.kpi-sub { font-size: 12px; color: var(--muted-2); margin-top: 4px; }
.trio { display: grid; grid-template-columns: 68px 1fr 34px; gap: 2px 8px; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--text-soft); }
.trio .bar { height: 6px; background: var(--grid-line); border-radius: 3px; overflow: hidden; }
.trio .bar span { display: block; height: 100%; border-radius: 3px; }
.trio .v { font-family: var(--serif); font-weight: 600; color: var(--uku-text); text-align: right; }
.textcard { background: var(--bg-soft); border: 1px solid var(--border); border-left: 3px solid var(--uku-gold); border-radius: 9px; padding: 14px 16px; }
.textcard h3 { font-size: 13.5px; font-weight: 600; margin: 0 0 8px; }
.textcard ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; }
.textcard li { font-size: 13px; color: var(--text-soft); padding-left: 14px; position: relative; line-height: 1.5; }
.textcard li::before { content: ''; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--uku-gold); }

/* рекомендації */
.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.rec { background: var(--uku-card); border: 1px solid var(--border); border-left: 3px solid var(--uku-wine); border-radius: 10px; padding: 18px 16px 14px; }
.rec .rec-num { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--uku-wine); line-height: 1; margin-bottom: 6px; }
.rec h3 { font-size: 14px; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
.rec p { margin: 6px 0 0; font-size: 12.5px; color: var(--text-soft); }
.rec .lbl { font-weight: 600; color: var(--uku-text); }

/* таблиці */
table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cmp th { text-align: left; font-weight: 600; color: var(--text-soft); font-size: 11.5px; padding: 0 6px 7px; border-bottom: 1px solid var(--border-strong); vertical-align: bottom; }
table.cmp td { padding: 6px 6px; border-bottom: 1px solid var(--grid-line); vertical-align: top; color: var(--uku-text); }
table.cmp tr:last-child td { border-bottom: none; }
table.cmp th.num, table.cmp td.num { text-align: right; white-space: nowrap; }
table.cmp td.num b { font-family: var(--serif); font-size: 14px; font-weight: 600; }
.tblwrap { overflow-x: auto; }
.pos, table.cmp td.pos { color: #0F7A3F; font-weight: 600; } .neg, table.cmp td.neg { color: #C2410C; font-weight: 600; }
.muted, table.cmp td.muted { color: var(--muted-2); }
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel-ctl { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
.panel-ctl label { color: var(--text-soft); font-weight: 600; }
.panel-ctl select { font: 12.5px var(--sans); padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: #fff; max-width: 100%; }

/* примітки внизу вкладки */
.notes { margin-top: 10px; padding: 16px 18px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; color: var(--text-soft); }
.notes h2 { font-family: var(--serif); font-size: 17px; color: var(--uku-navy); margin: 0 0 8px; }
.notes h3 { font-size: 12.5px; margin: 14px 0 6px; color: var(--uku-text); }
.notes p { margin: 6px 0; max-width: 120ch; }
.notes .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 28px; }

/* відкриті відповіді */
.oa-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 10px; }
.oa-bar input[type=search] { flex: 1 1 260px; font: 14px var(--sans); padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; }
.oa-bar select { font: 13px var(--sans); padding: 7px 8px; border: 1px solid var(--border-strong); border-radius: 8px; background: #fff; max-width: 340px; }
.oa-count { font-size: 12.5px; color: var(--muted-2); margin: 0 0 8px; }
.oa-list { max-height: 72vh; overflow-y: auto; background: var(--uku-card); border: 1px solid var(--border); border-radius: 10px; }
.oa-item { padding: 10px 14px; border-bottom: 1px solid var(--grid-line); }
.oa-item:last-child { border-bottom: 0; }
.oa-meta { font-size: 11.5px; color: var(--muted-2); margin-bottom: 3px; }
.oa-meta .g { font-weight: 600; color: var(--uku-navy); margin-right: 6px; }
.oa-text { font-size: 13.5px; line-height: 1.5; }
.oa-tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.oa-tags span { font-size: 10.5px; background: #F3EBDA; color: #6E5530; border-radius: 20px; padding: 1px 8px; cursor: pointer; }
mark { background: #EFDDB0; padding: 0 1px; border-radius: 2px; }

.mtext { font-size: 13px; color: var(--text-soft); line-height: 1.6; } .mtext p { margin: 8px 0 0; }
details.more { margin-top: 10px; } details.more summary { cursor: pointer; color: var(--uku-navy); font-weight: 600; font-size: 12.5px; }
.meth p { max-width: 120ch; font-size: 12.5px; color: var(--text-soft); margin: 8px 0; }
.meth p b { color: var(--uku-text); }
.print-only { display: none; }
footer { color: var(--muted-2); font-size: 12px; padding: 0 0 30px; }
@media (max-width: 1100px) { .recs > .rec { grid-column: span 3 !important; } }
@media (max-width: 760px) {
  .recs, .kpi-strip, .panel-grid, .textcard ul, .notes .cols { grid-template-columns: minmax(0, 1fr) !important; } .recs > .rec { grid-column: auto !important; }
  .top-grid { grid-template-columns: 1fr; } .meta-block { text-align: left; } .top h1 { font-size: 26px; }
}
@media print {
  .top { background: #fff; color: var(--uku-navy); padding: 0 0 12px; } .top::before { display: none; }
  .top h1, .meta-ns b { color: var(--uku-navy); } .meta-block, .meta-ns, .meta-label { color: var(--text-soft); }
  .nav, .panel-ctl select, .oa-bar { display: none !important; }
  .print-only { display: block; }
  .tab-panel > h2.print-only { font-family: var(--serif); font-size: 24px; color: var(--uku-navy); break-before: page; }
  #tab-overview > h2.print-only { break-before: auto; }
  section[id$="-open"] { display: none !important; }
  figure.fig { break-inside: avoid; }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g12 { grid-template-columns: minmax(0, 1fr); }
}

/* ===== версія для деканів: позначки змін ===== */
.hl-new { background: linear-gradient(transparent 52%, #FFE45C 52%); padding: 0 1px; }
.chg { position: relative; background: #FFFCE6; outline: 2px solid #F2D21B; outline-offset: 5px; border-radius: 8px; }
.chg-note { background: #FFF3A3; border-left: 4px solid #E0BC00; padding: 8px 12px; margin: 12px 0 4px; font-size: 12.5px; line-height: 1.45; color: #4D3F00; border-radius: 6px; }
.chg-note b { color: #3A2F00; }
.tabnote { margin: 0 0 22px; outline-offset: 2px; }
.tabnote .chg-note { margin: 0; }
.changelog { padding: 12px 16px; margin-bottom: 26px; }
.changelog summary { cursor: pointer; font-weight: 700; color: #4D3F00; font-size: 14px; }
.changelog ol { margin: 8px 0 0; padding-left: 20px; font-size: 13px; color: #3F3A30; } .changelog li { margin: 3px 0; }
body.clean .chg { background: none; outline: none; }
body.clean .chg-note, body.clean .changelog { display: none; }
body.clean .hl-new { background: none; }
.marks-toggle { margin-left: 8px; border: 1px solid #E0BC00 !important; background: #FFF3A3 !important; color: #4D3F00 !important; }
body.clean .marks-toggle { background: transparent !important; color: var(--text-soft) !important; border-color: var(--border-strong) !important; }
/* головне в п'яти пунктах */
.five { padding: 16px 18px 6px; }
.five h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--uku-navy); }
.five ol { list-style: none; counter-reset: p; margin: 0; padding: 0; display: grid; gap: 8px; }
.five li { counter-increment: p; position: relative; padding-left: 34px; font-size: 15px; line-height: 1.45; color: var(--uku-text); }
.five li::before { content: counter(p); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--uku-navy); color: #fff; font: 600 12px/22px var(--sans); text-align: center; }
.five li b { font-family: var(--serif); font-size: 18px; color: var(--uku-navy); margin-right: 3px; }
/* мій факультет */
.fac-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 14px 0 16px; }
.fac-pick label { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--uku-navy); }
.fac-pick select { font: 600 15px var(--sans); padding: 8px 12px; border: 2px solid var(--uku-navy); border-radius: 8px; background: #fff; color: var(--uku-text); max-width: 100%; }
.kpi-q .kq { font-size: 14px; font-weight: 600; color: var(--uku-text); line-height: 1.35; margin: 2px 0 4px; }
.trio-l { grid-template-columns: minmax(70px, auto) 1fr 40px; gap: 5px 10px; margin-top: 10px; font-size: 12.5px; }
.trio-l .bar { height: 9px; } .trio-l .v { font-size: 15px; }
.fac-n { font-size: 13px; color: var(--muted-2); }
.fac-vs { font-family: var(--sans) !important; font-size: 14px !important; font-weight: 500 !important; color: var(--text-soft) !important; }
.fac-pick select.fac-cmp { border-color: var(--border-strong); font-weight: 500; } .fac-pick select.fac-cmp.on { border-color: #2F4B7C; }
.fac-warn { font-size: 13px; color: var(--text-soft); margin: -6px 0 14px; } .fac-warn:empty { display: none; }
.cmpchip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; white-space: nowrap; }
.cmpchip.up { background: #2F4B7C; color: #fff; border: 1.5px solid #2F4B7C; } .cmpchip.down { background: #fff; color: #2F4B7C; border: 1.5px solid #2F4B7C; } .cmpchip.same { border: 1.5px solid transparent; } .cmpchip.same { background: #F1EEE9; color: #6B655E; }
.mirror { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto auto auto auto; column-gap: 14px; margin-top: 10px; }
.mir-side { grid-row: 1 / 5; display: grid; grid-template-rows: subgrid; row-gap: 0; column-gap: 28px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 16px; }
.mir-t { grid-column: 1 / 2; grid-template-columns: minmax(0, 1fr); } .mir-s { grid-column: 2 / 4; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mir-who { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.mir-ico { width: 48px; height: 48px; flex: none; }
.mir-who { flex-wrap: wrap; row-gap: 6px; } .mir-who > div { min-width: 0; }
#fig-overview-o_mirror { display: flex; flex-direction: column; } #fig-overview-o_mirror .mirror { margin: auto 0; } #fig-overview-o_mirror .starnote { margin-top: 14px; }
.mir-who b { display: block; font-size: 15px; color: var(--uku-text); line-height: 1.2; } .mir-who span { display: block; font-size: 12px; color: var(--muted-2); }
.mir-num { grid-row: 2; font-family: var(--serif); font-size: 38px; font-weight: 600; line-height: 1; }
.mir-txt { grid-row: 3; font-size: 13px; color: var(--text-soft); margin: 6px 0 12px; line-height: 1.4; }
.mir-picw { grid-row: 4; align-self: end; }
.mir-pic { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; max-width: 170px; } .mir-pic svg { width: 100%; height: auto; display: block; }
@media (max-width: 760px) { .mirror { display: block; } .mir-side { display: block; margin-bottom: 12px; } .mir-num, .mir-txt, .mir-picw { margin-top: 6px; } }
.top2-note { font-size: 12px; color: var(--text-soft); margin: 0 0 8px; padding: 4px 8px; background: var(--bg-soft); border-radius: 6px; display: inline-block; }
.fac-flags { margin-bottom: 16px; }
.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.flags li { color: var(--uku-text); } .flags .arr { display: inline-block; width: 1.3em; color: #2F4B7C; font-weight: 700; } .flags li b { color: inherit; }
ul.about { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--text-soft); line-height: 1.7; }
@media print { .marks-toggle { display: none !important; } }
.chg { background: none !important; outline: none !important; } .hl-new { background: none !important; }
</style>

<body>
<header class="top">

const lc = t => /^.[a-zа-яіїєґ’']/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
function headline(id, ch, d) {
  const tpl = DEAN_HL[id]; if (!tpl) return null;
  let bad = false;
  const out = tpl.replace(/\{([^}]+)\}/g, (m, tok) => {
    let v = null;
    if (ch.kind === 'compare' && /^[stp]\d$/.test(tok)) { const g = {s: 'students', t: 'teachers', p: 'staff'}[tok[0]]; const x = ch.series[g][+tok[1]]; return x ? pct(x.v) : (bad = true, '—'); }
    if (ch.kind === 'themes') { const r = ch.rows.slice().sort((a, b) => b.k - a.k)[0]; return {th_l: lc(r.label), th_k: r.k, th_n: ch.n, th_v: pct(r.v)}[tok]; }
    if (!d) { bad = true; return '—'; }
    if (tok === 'pos') v = posSum(ch, d.v);
    else if (tok.startsWith('o:')) { const i = ch.full.findIndex(f => f.startsWith(tok.slice(2))); v = i >= 0 ? d.v[i] : null; }
    else if (tok.startsWith('i:')) { const row = d.v[+tok.slice(2)]; v = row ? posSum(ch, row) : null; }
    else if (tok === 'top_l' || tok === 'top_v') { const idx = ch.full.map((_, i) => i).filter(i => !NONE.test(ch.full[i])).sort((a, b) => d.v[b] - d.v[a])[0]; return tok === 'top_l' ? lc(ch.labels[idx]) : pct(d.v[idx]); }
    if (v == null) bad = true; return pct(v); });
  return bad ? null : out;
}

  const short = f => SHORT[f] || f;
  const s = document.createElement('section'); s.className = 'block';
  s.innerHTML = `<div class="chg">${chgNote('Нова вкладка. Декан обирає свій факультет і бачить ключові показники студентів і викладачів поруч із середнім по УКУ. Вибір факультету тут також вмикає фільтр на вкладках «Студенти» і «Викладачі». <b>Раунд 2:</b> замість трьох чисел (факультет, УКУ, різниця в п.п.) — два числа і слово: «вище», «нижче» або «як по УКУ». «Вище/нижче» ставиться лише тоді, коли різниця більша за похибку. Позначку ≈ біля кожного числа замінено одним реченням під назвою факультету. <b>Раунд 4:</b> зелений і червоний прибрано — «вище» чи «нижче» не означає «добре» чи «погано». Тепер один нейтральний синій колір: «вище» — заповнена мітка, «нижче» — контурна. <b>Раунд 6:</b> додано список «Порівняти з»: УКУ загалом або будь-який інший факультет. Для двох факультетів «вище/нижче» ставиться за точним тестом Фішера (p < 0,10).')}

  const lf = (() => { const t = [0]; for (let i = 1; i <= 500; i++) t[i] = t[i - 1] + Math.log(i); return n => t[n]; })();
  const fisher = (a, b, c, d) => { const r1 = a + b, r2 = c + d, c1 = a + c, n = r1 + r2;
    const pr = x => Math.exp(lf(r1) + lf(r2) + lf(c1) + lf(n - c1) - lf(n) - lf(x) - lf(r1 - x) - lf(c1 - x) - lf(r2 - c1 + x));
    const p0 = pr(a); let p = 0; for (let x = Math.max(0, c1 - r2); x <= Math.min(r1, c1); x++) { const q = pr(x); if (q <= p0 * (1 + 1e-7)) p += q; } return Math.min(1, p); };

      : `<p class="mtext" style="margin:0">За ключовими показниками ${isU ? 'факультет не відрізняється від УКУ загалом' : 'факультети не відрізняються'} більше, ніж дозволяє похибка.</p>`);
    document.getElementById('facFoot').textContent = isU ? '«Вище» чи «нижче» — лише коли різниця більша за похибку вибірки; інакше — «як по УКУ».'
      : '«Вище» чи «нижче» — лише коли різницю між двома факультетами навряд чи пояснює випадковість (точний тест Фішера, p < 0,10); інакше — «приблизно однаково». На малих групах «приблизно однаково» означає «різницю не доведено».';
    if (sync) ['students', 'teachers'].forEach(g => { const sl = DATA.groups[g].slices.find(x => x.key === 'faculty=' + f); STATE[g] = sl && !sl.disabled ? sl.key : '__all__'; if (rendered.has(g)) apply(g, STATE[g]); });
  };
  setTimeout(() => { fillCmp();
    document.getElementById('facSel').onchange = () => { fillCmp(); draw(true); };
    document.getElementById('cmpSel').onchange = () => { document.getElementById('cmpSel').classList.toggle('on', document.getElementById('cmpSel').value !== '__uku__'); draw(false); };
    draw(false); });
  return s;
}

// Перелік змін — угорі першої вкладки
function changeLog() { return document.createElement('div'); }

// Шкали згоди → звичайні горизонтальні стовпчики: частка «радше + цілком» (раунд 2)
function drawTop2(fig, ch, d0) {
  const keepI = d0.v.map((r, i) => r ? i : -1).filter(i => i >= 0);
  fig._hiddenItems = d0.v.length - keepI.length;
  const sc = ch.scale, posL = sc.positive.map(r => ch.labels[sc.rank.indexOf(r)]);
  const val = i => posSum(ch, d0.v[i]);
  const order = keepI.slice().sort((a, b) => val(b) - val(a));
  fig.insertAdjacentHTML('beforeend', `<div class="top2-note">Частка відповідей ${posL.map(l => '«' + esc(l.toLowerCase()) + '»').join(' або ')}</div>`);
  const ft = ch.facetTests || {};
  const labels = order.map(i => { const t = ft[String(i)] ? Object.values(ft[String(i)]).filter(x => x.sig) : []; const w = wrap(ch.items[i], labelW(fig, .45)); if (t.length) w[w.length - 1] += ' *'; return w; });
  const cv = box(fig, need(labels)); const vals = order.map(val); const max = Math.min(1.1, Math.max(...vals) * 1.18 + .04);
  return new Chart(cv, { type: 'bar', data: { labels, datasets: [{ data: vals, backgroundColor: C.primary, borderRadius: 4, borderSkipped: false, barPercentage: .78, categoryPercentage: .9, maxBarThickness: 22 }] },
    options: { indexAxis: 'y', scales: { x: hiddenX(max), y: yAxis },
      plugins: { valueLabels: {on: true}, tooltip: {callbacks: {title: it => ch.itemsFull[order[it[0].dataIndex]],
        label: it => { const row = d0.v[order[it.dataIndex]]; return sc.positive.map(r => ` ${ch.labels[sc.rank.indexOf(r)]}: ${pct(row[sc.rank.indexOf(r)])}`); },
        footer: it => `n = ${d0.n[order[it[0].dataIndex]]}`}} } } });
}

// Пояснення правил: дві «картинки» замість стовпчиків — різні питання для двох груп (раунд 3)
const ICON_T = c => `<svg viewBox="0 0 72 72" class="mir-ico" aria-hidden="true"><rect x="34" y="10" width="34" height="24" rx="2" fill="none" stroke="${c}" stroke-width="2.5"/><path d="M40 18h20M40 24h14" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="8" fill="${c}"/><path d="M6 62v-16c0-8 6-14 14-14s14 6 14 14v16z" fill="${c}"/><path d="M30 38l10-8" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const ICON_S = c => `<svg viewBox="0 0 72 72" class="mir-ico" aria-hidden="true"><path d="M36 6l24 10-24 10-24-10z" fill="${c}"/><path d="M56 18v12" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><circle cx="56" cy="32" r="2.5" fill="${c}"/><circle cx="36" cy="30" r="9" fill="${c}"/><path d="M20 66v-14c0-9 7-15 16-15s16 6 16 15v14z" fill="${c}"/></svg>`;
let PID = 0;
const PERSON = (c, f) => { const id = 'pf' + (++PID), o = Math.round(f * 1000) / 10;
  return `<svg viewBox="0 0 12 20" aria-hidden="true"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="1" x2="11" y1="0" y2="0"><stop offset="${o}%" stop-color="${c}"/><stop offset="${o}%" stop-color="#E2DCD3"/></linearGradient></defs><circle cx="6" cy="4" r="3.4" fill="url(#${id})"/><path d="M1 19v-6.5C1 9.5 3.2 8 6 8s5 1.5 5 4.5V19z" fill="url(#${id})"/></svg>`; };
const pictos = (v, c) => { const k = Math.round(v * 100) / 10; return `<div class="mir-pic" title="${pct(v)}: ${String(k).replace('.', ',')} з 10 осіб">${Array.from({length: 10}, (_, i) => PERSON(c, Math.max(0, Math.min(1, k - i)))).join('')}</div>`; };
function mirrorCard(ch) {
  const t = ch.series.teachers[0], s1 = ch.series.students[1], s2 = ch.series.students[2];
  // одна сітка на 3 однакові колонки; рядки (число / текст / фігурки) спільні для обох панелей через subgrid
  const stat = (col, x, c, txt) => `<div class="mir-num" style="grid-column:${col};color:${c}">${pct(x.v)}</div><div class="mir-txt" style="grid-column:${col}">${txt}</div><div class="mir-picw" style="grid-column:${col}">${pictos(x.v, c)}</div>`;
  return `<div class="mirror">
    <div class="mir-side mir-t"><div class="mir-who">${ICON_T(C.g.teachers)}<div><b>Викладачі</b><span>про себе</span></div></div>
      ${stat(1, t, C.g.teachers, '«Я <b>завжди</b> пояснюю правила щодо ШІ»')}</div>
    <div class="mir-side mir-s"><div class="mir-who">${ICON_S(C.g.students)}<div><b>Студенти</b><span>про своїх викладачів</span></div></div>
      ${stat(1, s1, C.g.students, '«Правила пояснюють <b>усі</b> викладачі»')}
      ${stat(2, s2, C.g.students, '«Пояснюють <b>більшість або всі</b> викладачі»')}</div></div>
    <div class="starnote">Це різні питання для двох груп, тому їх показано поруч, а не на одній шкалі. Кожна фігурка — 10% відповідей.</div>`;
}

// «Головне»: у картці — питання, яке ставили, і частки груп; без речень-висновків
function deanLead() {
  const S = DATA.charts, GK = {Студенти: 'students', Викладачі: 'teachers', Персонал: 'staff'};
  const usedI = S.s_essay_used.full.findIndex(f => f.startsWith('Генерування тексту за допомогою ШІ з подальшим'));
  const used = S.s_essay_used.data.__all__, acc = S.s_essay.data.__all__;
  const KQ = [
    ['Чи використовуєте ви інструменти ШІ у навчанні / роботі?', 'Відповідь «Так»'],
    ['Чи відомо вам про політики використання ШІ, запроваджені в УКУ?', 'Відповідь «Так, і я ознайомлювався/лась з ними»'],
    ['Чи хотіли б ви краще розуміти, як застосовувати ШІ?', 'Відповіді «Так»'],
    ['«Я відчуваю підтримку від УКУ в розвитку навичок роботи з ШІ»', 'Відповіді «Радше погоджуюсь» або «Цілком погоджуюсь»'],
  ];
  const cards = DATA.kpis.map((k, i) => { const [q, sub, rows] = KQ[i];
    const list = rows ? rows.map(([l, v]) => [l, v, C.g.students]) : k.trio.map(t => [t.g, t.v, C.g[GK[t.g]]]);
    return `<div class="kpi kpi-q"><div class="kpi-label">${esc(k.decision)}</div><div class="kq">${esc(q)}</div><div class="kpi-sub">${esc(sub)}</div>
      <div class="trio trio-l">${list.map(([l, v, c]) => `<span>${esc(l)}</span><span class="bar"><span style="width:${v * 100}%;background:${c}"></span></span><span class="v">${pct(v)}</span>`).join('')}</div></div>`; }).join('');
  const s = document.createElement('section'); s.className = 'block'; s.id = 'overview-lead';
  s.innerHTML = `<div class="section-head"><h2 class="section-title">Головне</h2></div><div class="kpi-strip" style="grid-template-columns:repeat(2,minmax(0,1fr))">${cards}</div>`;
  return s;
}
